name: Build_Architect_IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Find and Extract Zip
        run: |
          # البحث عن أي ملف مضغوط واستخراجه تلقائياً
          FILE=$(ls *.tar.gz *.zip | head -n 1)
          echo "Found file: $FILE"
          tar -xzf "$FILE" || unzip "$FILE"
          
          # إنشاء هيكلية الـ IPA
          mkdir -p Payload/Architect.app
          # نقل كل شيء لمجلد التطبيق لضمان التجميع
          cp -R . Payload/Architect.app/ || true
          
      - name: Create IPA Package
        run: |
          zip -r Architect.ipa Payload
          
      - name: Upload IPA Result
        uses: actions/upload-artifact@v4
        with:
          name: Final-Architect-App
          path: Architect.ipa
