name: Build_Architect_IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          tar -xzf architect-terminal-dist.tar.gz
          mkdir -p Payload/Architect.app
          # نقل الملفات الناتجة لمجلد التطبيق
          cp -R . Payload/Architect.app/
          
      - name: Create IPA Package
        run: |
          zip -r Architect.ipa Payload
          
      - name: Upload IPA Result
        uses: actions/upload-artifact@v4
        with:
          name: My-Architect-App
          path: Architect.ipa
